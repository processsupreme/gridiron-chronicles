name: Sync league archive

# Bakes the current Yahoo season into data/league_data.json so the permanent
# record stays current without anyone running a script. Live scores do not
# depend on this (they come from /api/live); this is the durable copy.
#
# Needs three repository secrets (set them with `node tools/yahoo-auth.js --publish`):
#   YAHOO_CLIENT_ID, YAHOO_CLIENT_SECRET, YAHOO_REFRESH_TOKEN
# Until they exist the job exits cleanly without changing anything.

on:
  schedule:
    - cron: '0 11 * * 2'  # Tuesday morning US time, after Monday night football
    - cron: '0 11 * * 5'  # Friday, after Thursday's stat corrections
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-archive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull the current season from Yahoo
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: node tools/sync-archive.js
      - name: Check the numbers still add up
        run: node tests/engine.test.mjs && node tests/yahoo.test.js
      - name: Commit if the archive changed
        run: |
          if git diff --quiet -- data/league_data.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "bkgffl-ledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/league_data.json
          git commit -m "Sync league archive from Yahoo"
          git push
