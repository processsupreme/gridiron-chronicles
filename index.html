<script>
// Service worker: registers, checks for new builds every 30 minutes, and
// offers a one-tap refresh when one is waiting.
if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').then(function (reg) {
      setInterval(function () { reg.update().catch(function () {}); }, 30 * 60 * 1000);
      function offer(worker) {
        var toast = document.getElementById('toast');
        if (!toast || !worker) return;
        toast.innerHTML = '<span>A new version is ready.</span><button type="button">Refresh</button>';
        toast.hidden = false;
        toast.querySelector('button').onclick = function () { worker.postMessage({ type: 'SKIP_WAITING' }); };
      }
      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) offer(nw);
        });
      });
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }).catch(function () {});
  });
}
</script>
